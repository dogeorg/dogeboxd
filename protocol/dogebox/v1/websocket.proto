syntax = "proto3";

package dogebox.v1;

import "dogebox/v1/bootstrap.proto";
import "dogebox/v1/types.proto";
import "google/protobuf/struct.proto";

// Wire values are the ChangeType string constants in pkg/events.go,
// e.g. CHANGE_TYPE_JOB_CREATED is "job:created" on the wire.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_BOOTSTRAP = 1;
  CHANGE_TYPE_PUP = 2;
  CHANGE_TYPE_PUP_PURGED = 3;
  CHANGE_TYPE_STATS = 4;
  CHANGE_TYPE_ACTION = 5;
  CHANGE_TYPE_PROMPT = 6;
  CHANGE_TYPE_PROGRESS = 7;
  CHANGE_TYPE_SYSTEM_UPDATE_AVAILABLE = 8;
  CHANGE_TYPE_RECOVERY = 9;
  CHANGE_TYPE_PUP_UPDATES_CHECKED = 10;

  // Job lifecycle events emitted by the JobManager ("job:*" on the wire).
  CHANGE_TYPE_JOB_CREATED = 11;
  CHANGE_TYPE_JOB_UPDATED = 12;
  CHANGE_TYPE_JOB_COMPLETED = 13;
  CHANGE_TYPE_JOB_FAILED = 14;
  CHANGE_TYPE_JOB_ORPHANED = 15;
  CHANGE_TYPE_JOB_DELETED = 16;

  // Legacy "job_completed" underscore variant still emitted by the
  // SystemUpdater completion path.
  CHANGE_TYPE_JOB_COMPLETED_LEGACY = 17;
}

message PupPurgedUpdate {
  string pup_id = 1;
}

message StatsUpdate {
  repeated PupStats stats = 1;
}

message Change {
  string id = 1;
  uint64 seq = 2;
  int64 ts = 3;
  string error = 4;
  ChangeType type = 5;

  oneof update {
    BootstrapResponse bootstrap = 6;
    JobsBootstrap jobs_bootstrap = 7;
    PupState pup = 8;
    StatsUpdate stats = 9;
    ActionProgress progress = 10;
    JobRecord job = 11;
    PupPurgedUpdate pup_purged = 12;
    PupUpdatesCheckedEvent pup_updates_checked = 13;
    google.protobuf.Struct object_update = 14;
    google.protobuf.Value value_update = 15;
  }
}
